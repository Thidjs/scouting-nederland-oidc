name: Recover v1.0.3 release asset and update feed

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-release-asset:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download validated package from original tag run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download 45383065874 --repo "${GITHUB_REPOSITORY}" --name joomla-package --dir dist
          test -s dist/pkg_scoutingoidc-build.zip
          mv dist/pkg_scoutingoidc-build.zip dist/pkg_scoutingoidc-1.0.3.zip
      - name: Upload package to existing v1.0.3 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v1.0.3 --repo "${GITHUB_REPOSITORY}" >/dev/null
          gh release upload v1.0.3 dist/pkg_scoutingoidc-1.0.3.zip --repo "${GITHUB_REPOSITORY}" --clobber

  deploy-feed:
    needs: recover-release-asset
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.0.3
      - name: Download published release package and generate feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release
          gh release download v1.0.3 --repo "${GITHUB_REPOSITORY}" --pattern pkg_scoutingoidc-1.0.3.zip --dir release
          python3 scripts/generate_update_feed.py --version 1.0.3 --zip release/pkg_scoutingoidc-1.0.3.zip --output site/updates/scoutingoidc.xml
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          import xml.etree.ElementTree as ET
          manifest = ET.parse('pkg_scoutingoidc.xml').getroot()
          feed = ET.parse('site/updates/scoutingoidc.xml').getroot()
          assert manifest.findtext('version') == '1.0.3'
          assert feed.findtext('update/version') == '1.0.3'
          assert feed.findtext('update/sha256') == hashlib.sha256(Path('release/pkg_scoutingoidc-1.0.3.zip').read_bytes()).hexdigest()
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy Joomla update feed
        id: deployment
        uses: actions/deploy-pages@v4
